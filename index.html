<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada Otaku - Quiz de Anime</title>
    <!-- Fonte temática Orbitron + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <h1>JORNADA OTAKU</h1>
        <p class="subtitulo">Descubra o seu destino no mundo dos animes</p>
       
        <!-- Tela Inicial -->
        <div class="tela-inicial">
            <p>
                Você foi subitamente transportado para um universo paralelo onde magia, batalhas épicas e mistérios dominam a realidade.
                Cada decisão traçará a sua lenda. Você aceita o chamado?
            </p>
            <button class="iniciar-btn">DESPERTAR PODER</button>
        </div>

        <!-- Caixas do Jogo -->
        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
       
        <!-- Tela de Resultado Final -->
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="novamente-btn">REINICIAR JORNADA</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
